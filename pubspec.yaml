name: lucky_draw
description: Offline Employee Lucky Draw Windows App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite_common_ffi: ^2.3.4+4
  path: ^1.9.0
  path_provider: ^2.1.5
  file_picker: ^8.3.7
  excel: ^4.0.6
  window_manager: ^0.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  image_path: "assets/sk_new_logo.jpeg"
  windows:
    generate: true
    icon_size: 48

flutter:
  uses-material-design: true
  assets:
    - assets/sk_new_logo.jpeg